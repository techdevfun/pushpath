# Synthetic fixture: a solo deploy path.
# A push to main deploys straight to the npm registry: no environment,
# no approver, contents: write, and a floating action tag.
# Verdict must be SOLO-PATH.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
